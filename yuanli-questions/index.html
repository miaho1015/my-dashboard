<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>元利茶會問題清單</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: one narrow column like a checklist sheet; each question is a row with check, text, a reply box and edit/delete actions. */
:root {
  --bg: #edf1ee;
  --surface: #fafcfb;
  --fg: #1c2a24;
  --muted: #5f7068;
  --line: #d1dcd5;
  --accent: #2c5b4d;
  --accent-fg: #f4faf7;
  --gold: #8f7232;
  --danger: #a23b3b;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a16; --surface: #19241f; --fg: #e3ebe6; --muted: #93a79d; --line: #2b3b34;
    --accent: #7dbfa6; --accent-fg: #0f1a15; --gold: #cdae60; --danger: #e48a8a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a16; --surface: #19241f; --fg: #e3ebe6; --muted: #93a79d; --line: #2b3b34;
  --accent: #7dbfa6; --accent-fg: #0f1a15; --gold: #cdae60; --danger: #e48a8a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
header h1 { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-variant-numeric: tabular-nums; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.progress { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; display: flex; gap: 16px; flex-wrap: wrap; }
.progress b { color: var(--accent); font-size: 1.05rem; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 6px 14px; }
button:hover { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
button.primary:hover { filter: brightness(1.08); color: var(--accent-fg); }
button.small { padding: 4px 12px; font-size: 0.85rem; }
button.link { border: none; padding: 2px 6px; color: var(--muted); font-size: 0.85rem; }
button.link:hover { color: var(--accent); }
button.link.del:hover, button.link.confirm { color: var(--danger); }
button.link.confirm { font-weight: 700; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea {
  font: inherit; width: 100%; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; resize: vertical; min-height: 64px;
}
.add { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.add label { font-size: 0.8rem; letter-spacing: 0.06em; color: var(--muted); }
.add .row { display: flex; justify-content: flex-end; }
ol.list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--gold); }
.q { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; padding: 14px 2px; border-bottom: 1px solid var(--line); }
.q .lead { grid-row: 1 / span 3; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.q .chk { padding-top: 3px; }
.q .handle { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; color: var(--muted); font-size: 1.1rem; line-height: 1; letter-spacing: -2px; padding: 6px 4px; border-radius: 6px; }
.q .handle:hover { color: var(--accent); background: var(--surface); }
.q.ghost { opacity: 0.35; }
.q.drag { background: var(--surface); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.q input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; margin: 0; }
.q .txt { min-width: 0; overflow-wrap: anywhere; }
.q .no { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.q.done .txt .t { color: var(--muted); }
.q .reply { grid-column: 2; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.q .reply label { font-size: 0.75rem; letter-spacing: 0.06em; color: var(--gold); }
.q .reply textarea { min-height: 56px; background: var(--surface); }
.q .rrow { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.q .saved { color: var(--accent); font-size: 0.85rem; }
.q .acts { grid-column: 2; display: flex; gap: 2px; margin-left: -6px; }
.q.editing { grid-template-columns: minmax(0, 1fr); background: var(--surface); padding: 14px; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; }
.q.editing label { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.06em; }
.q.editing .btns { display: flex; gap: 8px; justify-content: flex-end; }
.state { color: var(--muted); text-align: center; padding: 28px 0; margin: 0; }
.msg { min-height: 1.4em; font-size: 0.85rem; color: var(--danger); margin: 0; }
.note { font-size: 0.85rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; margin: 0; }
@media (max-width: 480px) { header h1 { font-size: 1.45rem; } }
@media (prefers-reduced-motion: no-preference) { button { transition: border-color .15s, color .15s, filter .15s; } }
* { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
</style>

</head>
<body>
<main>
  <header>
    <h1>元利茶會問題清單</h1>
    <p class="meta"><span>拾光成織｜美麗人間 開幕茶會</span><span>11/15（日）13:30</span><span>場勘 10/29（四）13:00</span></p>
  </header>

  <div class="bar">
    <div class="progress" id="progress" aria-live="polite"></div>
    <div class="btnrow"><button id="copyAll" type="button">複製全部問題</button><button id="copyQA" type="button">複製問題與回覆</button></div>
  </div>

  <p class="note" id="roNote">資料只存在這個瀏覽器，換裝置或清除網站資料就會消失，重要回覆請用「複製問題與回覆」另存。</p>

  <form class="add" id="addForm" autocomplete="off">
    <label for="newText">新增問題</label>
    <textarea id="newText" rows="2" placeholder="輸入想問客戶的問題，Ctrl／⌘ + Enter 送出"></textarea>
    <div class="row"><button class="primary" id="addBtn" type="submit">新增</button></div>
  </form>
  <p class="msg" id="msg" role="status"></p>

  <div id="list"><p class="state">載入中…</p></div>
</main>

<script>
(function () {
  var KEY = "yuanli-questions-v1";
  var SEED = [
    "原廠商的硬體清單、規格與報價（舞台、背板、燈光、音響、桌椅），用來比較「原規格 vs 優化」。",
    "預算範圍或上限？兩位董事長對「大器、有質感」的具體期待或關鍵詞是什麼？",
    "場勘時接待中心能否拍照、丈量、檢視天花板與電源？進場、彩排、撤場時間分別是什麼時候？",
    "流程以 P24 還是邀請卡為準？邀請卡沒有分兩巡茶；P24 最後「15:00 賦歸」與「15:00–15:30 自由參觀」互相衝突，賦歸是 15:30 嗎？",
    "開場表演選方案 1（絲竹 5 人，35,000）還是方案 2（古箏 1 人，10 分鐘）？方案 2 超過 P24 的 8 分鐘時段，是否調整？主持人是否已定？",
    "14:45 後的藝術品解說與自由參觀，在接待中心如何進行？現場有沒有擺作品？藝術家站哪裡、要不要麥克風？貴賓怎麼流動？",
    "席位約 64、貴賓 60，工作人員、藝術家、董事長的座位怎麼處理？",
    "封茶儀式是 60 位貴賓同時封茶，還是代表上台？茶盒、青瓷茶罐與紀念茶甕的擺放、收納與發放位置在哪？",
    "兩巡茶由誰負責？是否需要煮水用電、水源與排水？",
    "背板用展覽主視覺（鳳凰、褐金色調），還是另行設計？設計稿由誰提供？",
    "簽到台、導引標示、後台或休息室、攝影平台、花藝，各自誰負責？",
    "貴賓停車與下車點、雨天備案、媒體或攝影是否有安排？",
    "市集攤位是否增加？（先放著不處理）"
  ];
  var items = [], storageOk = true;
  var editingId = null, editText = "", confirmId = null, savedId = null;
  var answerDrafts = {};

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $("list"), msgEl = $("msg");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function say(t) { msgEl.textContent = t || ""; }
  function hasDraft(id) { return Object.prototype.hasOwnProperty.call(answerDrafts, id); }
  function uid() { return "q" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { items = JSON.parse(raw); return; }
    } catch (e) { storageOk = false; }
    items = SEED.map(function (t, i) { return { id: "s" + (i + 1), text: t, done: false, answer: "", order: i + 1 }; });
    save();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); }
    catch (e) { storageOk = false; say("這個瀏覽器無法儲存資料，關閉頁面後內容會消失。"); }
  }
  var sortable = null;
  function initSort() {
    if (sortable) { sortable.destroy(); sortable = null; }
    var ol = listEl.querySelector("ol.list");
    if (!ol || !window.Sortable) return;
    sortable = Sortable.create(ol, {
      handle: ".handle", animation: 150, ghostClass: "ghost", dragClass: "drag", filter: ".editing",
      onEnd: function () {
        var ids = Array.prototype.map.call(ol.children, function (li) { return li.dataset.id; });
        var byId = {}; items.forEach(function (q) { byId[q.id] = q; });
        var next = ids.map(function (id) { return byId[id]; }).filter(Boolean);
        if (next.length === items.length) { items = next; save(); }
        render();
      }
    });
  }
  function move(id, dir) {
    var i = items.map(function (q) { return q.id; }).indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= items.length) return;
    var t = items[i]; items[i] = items[j]; items[j] = t;
    save(); render();
    var li = listEl.querySelector('[data-id="' + id + '"] [data-act="' + (dir < 0 ? "up" : "down") + '"]');
    if (li) li.focus();
  }
  function findItem(id) { return items.filter(function (q) { return q.id === id; })[0]; }
  function patch(id, p) { var q = findItem(id); if (q) { Object.assign(q, p); save(); } }

  function row(q, n) {
    if (editingId === q.id) {
      return '<li class="q editing" data-id="' + esc(q.id) + '">' +
        '<label for="edText">修改問題</label><textarea id="edText" rows="3">' + esc(editText) + "</textarea>" +
        '<div class="btns"><button type="button" data-act="cancel">取消</button><button type="button" class="primary" data-act="save">儲存</button></div></li>';
    }
    var val = hasDraft(q.id) ? answerDrafts[q.id] : (q.answer || "");
    var reply = '<div class="reply"><label for="ans-' + esc(q.id) + '">客戶回覆</label>' +
      '<textarea id="ans-' + esc(q.id) + '" data-ans rows="2" placeholder="填入客戶的回答…">' + esc(val) + "</textarea>" +
      '<div class="rrow"><span class="saved" data-saved="' + esc(q.id) + '">' + (savedId === q.id ? "已儲存" : "") + '</span>' +
      '<button type="button" class="primary small" data-act="saveans">儲存回覆</button></div></div>';
    var isConfirm = confirmId === q.id;
    return '<li class="q' + (q.done ? " done" : "") + '" data-id="' + esc(q.id) + '">' +
      '<div class="lead"><label class="chk"><input type="checkbox" data-act="toggle" aria-label="已問"' + (q.done ? " checked" : "") + "></label>" +
      '<span class="handle" title="拖曳排序" aria-hidden="true">⋮⋮</span></div>' +
      '<div class="txt"><span class="no">' + n + '.</span><span class="t">' + esc(q.text) + "</span></div>" +
      reply +
      '<div class="acts"><button type="button" class="link" data-act="up" aria-label="上移">↑ 上移</button><button type="button" class="link" data-act="down" aria-label="下移">↓ 下移</button><button type="button" class="link" data-act="edit">編輯問題</button>' +
      (isConfirm
        ? '<button type="button" class="link confirm" data-act="del">確定刪除？</button><button type="button" class="link" data-act="nodel">取消</button>'
        : '<button type="button" class="link del" data-act="del">刪除</button>') + "</div></li>";
  }

  function render() {
    var asked = items.filter(function (q) { return q.done; }).length;
    var answered = items.filter(function (q) { return (q.answer || "").trim(); }).length;
    $("progress").innerHTML = "<span>已問 <b>" + asked + "</b> / " + items.length + "</span><span>已有回覆 <b>" + answered + "</b> / " + items.length + "</span>";
    if (!items.length) { listEl.innerHTML = '<p class="state">還沒有問題。在上方輸入第一題。</p>'; return; }
    listEl.innerHTML = '<ol class="list">' + items.map(function (q, i) { return row(q, i + 1); }).join("") + "</ol>";
    initSort();
  }

  listEl.addEventListener("input", function (e) {
    var li = e.target.closest(".q");
    if (!li) return;
    if (e.target.id === "edText") editText = e.target.value;
    else if (e.target.hasAttribute("data-ans")) { answerDrafts[li.dataset.id] = e.target.value; savedId = null; var s = li.querySelector(".saved"); if (s) s.textContent = ""; }
  });

  listEl.addEventListener("change", function (e) {
    var b = e.target.closest('[data-act="toggle"]');
    if (!b) return;
    patch(b.closest(".q").dataset.id, { done: b.checked });
    render();
  });

  listEl.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]");
    if (!b) return;
    var li = b.closest(".q"), id = li.dataset.id, act = b.dataset.act, q = findItem(id);
    say("");
    if (act === "edit" && q) {
      editingId = id; confirmId = null; editText = q.text || "";
      render();
      var t = $("edText"); if (t) t.focus();
    } else if (act === "up" || act === "down") {
      move(id, act === "up" ? -1 : 1);
    } else if (act === "cancel") {
      editingId = null; render();
    } else if (act === "save") {
      var text = editText.trim();
      if (!text) { say("問題不能是空的。"); return; }
      patch(id, { text: text }); editingId = null; render();
    } else if (act === "saveans" && q) {
      var val = (hasDraft(id) ? answerDrafts[id] : (q.answer || "")).trim();
      patch(id, { answer: val });
      delete answerDrafts[id];
      savedId = id;
      render();
      setTimeout(function () {
        if (savedId === id) savedId = null;
        var s = listEl.querySelector('[data-saved="' + id + '"]');
        if (s) s.textContent = "";
      }, 2000);
    } else if (act === "del") {
      if (confirmId !== id) { confirmId = id; render(); return; }
      confirmId = null;
      items = items.filter(function (x) { return x.id !== id; });
      delete answerDrafts[id];
      save(); render();
    } else if (act === "nodel") {
      confirmId = null; render();
    }
  });

  function addQuestion() {
    var ta = $("newText"), text = ta.value.trim();
    if (!text) { say("請先輸入問題。"); return; }
    say("");
    items.push({ id: uid(), text: text, done: false, answer: "", order: Date.now() });
    save(); render();
    ta.value = ""; ta.focus();
  }
  $("addForm").addEventListener("submit", function (e) { e.preventDefault(); addQuestion(); });
  $("newText").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addQuestion(); }
  });

  function copyText(text, btn, label) {
    if (!text) { say("目前沒有內容可複製。"); return; }
    var p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject();
    p.then(function () { say(""); btn.textContent = "已複製"; setTimeout(function () { btn.textContent = label; }, 1600); })
     .catch(function () { say("無法自動複製，請手動選取文字。"); });
  }
  $("copyAll").addEventListener("click", function () {
    copyText(items.map(function (q, i) { return (i + 1) + ". " + q.text; }).join("\n"), this, "複製全部問題");
  });
  $("copyQA").addEventListener("click", function () {
    copyText(items.map(function (q, i) {
      return (i + 1) + ". " + q.text + "\n   回覆：" + ((q.answer || "").trim() || "（尚未回覆）");
    }).join("\n\n"), this, "複製問題與回覆");
  });

  load();
  if (!storageOk) $("roNote").textContent = "這個瀏覽器無法儲存資料，關閉頁面後內容會消失。";
  render();
})();
</script>
</body>
</html>
